name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Types (mypy)
        run: uv run mypy

      - name: Types (ty)
        run: uv run ty check src/autofag

      - name: Dead code (vulture)
        run: uv run vulture

      - name: Test
        run: uv run pytest -q

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Clone and run
        run: uv run autofag version

      - name: Install the way the README says
        run: uv tool install "git+file://$PWD"

      - name: Command is on PATH
        run: autofag version

      - name: Browser bootstraps itself
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browsers
        run: uv run python tests/smoke_browser_bootstrap.py
