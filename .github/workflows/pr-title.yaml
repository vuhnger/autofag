name: PR title

# pull_request, ikke pull_request_target: sistnevnte fyrer aldri for PR-er som
# release-please oppretter med GITHUB_TOKEN, og da blir en påkrevd sjekk som aldri
# rapporterer til en lås på main. Jobben leser bare tittelen, så det begrensede
# tokenet en fork får med pull_request holder.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
