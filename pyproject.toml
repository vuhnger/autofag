[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autofag"
dynamic = ["version"]
description = "Overvåker emner på UiO Studentweb og melder deg på når en plass blir ledig"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Victor Rørslett Uhnger" }]
keywords = ["uio", "studentweb", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "keyring>=25.0.0",
  "lxml>=5.2.0",
  "playwright>=1.44.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "questionary>=2.0.1",
  "rich>=13.7.0",
  "SQLAlchemy>=2.0.30",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "ty>=0.0.1a1",
  "types-PyYAML>=6.0.12",
  "vulture>=2.14",
]

[project.urls]
Homepage = "https://github.com/vuhnger/autofag"
Issues = "https://github.com/vuhnger/autofag/issues"

[project.scripts]
autofag = "autofag.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autofag = ["fixtures/**/*"]

[tool.setuptools_scm]
version_file = "src/autofag/_version.py"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/autofag"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ty.src]
include = ["src/autofag"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
sort_by_size = true
ignore_decorators = ["@app.command", "@field_validator"]
ignore_names = ["cls", "signal_number", "frame", "observed_at", "updated_at"]
